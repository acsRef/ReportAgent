[pytest]
# ReportAgent pytest 配置（review-prep-r2 修复 71 failed root cause 后从 backend/pytest.ini 移到 repo root）
#
# 关键：pytest.ini 必须在 rootdir 下才生效。pytest 自动 rootdir 用 .git 定位，
# 之前在 backend/pytest.ini 时，rootdir = repo root（找到 .git）→ pytest.ini
# 不在 rootdir → asyncio_mode = auto 不生效 → pytest-asyncio 默认 STRICT →
# async test 不被识别 → 71 failed。
# 移到 repo root 后，任何 rootdir（repo root 或 backend）都通过 .git / 上一级
# .git 找到本文件 → asyncio_mode = auto 生效。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: quick smoke tests (no external deps)
    persistence: tests that require running PostgreSQL
    graphs: tests for LangGraph graphs
    contracts: tests for shared Pydantic/TS contracts
    api: tests for FastAPI endpoints
    e2e: full end-to-end tests requiring backend + PG + LLM keys

# CI：每次 push / PR 自动跑测试
#
# 设计目标（2026-10-28 与用户确认）：**每次提交代码就自动跑一遍测试，看情况**。
#   - 触发：任意分支的 push + 所有 PR
#   - backend-gate ：全量 pytest（PG service 真跑 persistence；e2e marker 无
#                    REPORTAGENT_E2E 自动 skip）
#   - frontend-gate：vitest 单测 + tsc 类型检查 + oxlint + vite build
#   - eval-platform-gate：评测平台自测（判定器口径也算被测代码）
# 真 LLM / 真 RAG 的「真链路」不在这里 —— 见 live-eval.yml（每晚 + 手动，plan 2026-11-18-live-ci-pipeline）。
#   Playwright Contract E2E **不在本 workflow**（见 e2e-contract.yml）：
#     mock keying = 语义 kind + 调用序，prompt 一改就错位，属于"改了文案就红"
#     的假失败，不该拦提交。
#
# 想要更安静的话可以给 push 加 paths 过滤（只在 backend/** / frontend/** 变化时跑），
# 但当前刻意不加——用户的诉求是"每次提交都跑"。
name: ci

on:
  pull_request:
  push:
    branches: ["**"]

# 连续 push 同一分支时取消上一次，避免排队堆积（只保留最新一次结果）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.7.0-pg15
        env:
          POSTGRES_USER: ragent
          POSTGRES_PASSWORD: ragent
          POSTGRES_DB: ragent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ragent:ragent@localhost:5432/ragent
      ANALYSIS_DSN: postgresql://ragent_readonly:ragent_readonly@localhost:5432/ragent
      APP_ENV: development
      ALLOW_INSECURE_DEFAULT_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Init PostgreSQL (app schema + retail seed + read-only role)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=ragent
          psql -h localhost -U ragent -d ragent -f backend/scripts/init_pg.sql
          psql -h localhost -U ragent -d ragent -f backend/scripts/seed_business_p15prelude.sql
          psql -h localhost -U ragent -d ragent -f backend/scripts/setup_app_role.sql
      - name: Backend offline suite (incl. persistence on real PG)
        # 失败详情经 ::error:: 进 job annotations（check-runs API 匿名可读，诊断用）
        run: |
          set +e
          python -m pytest -q --tb=short > /tmp/pytest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -50 /tmp/pytest.log | while IFS= read -r line; do
              echo "::error file=backend-suite::$line"
            done
          fi
          exit $code

  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Frontend unit tests
        run: |
          set +e
          npm --prefix frontend run test:run > /tmp/vitest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -40 /tmp/vitest.log | while IFS= read -r line; do
              echo "::error file=frontend-vitest::$line"
            done
          fi
          exit $code
      - name: Type-check (tsc -b)
        # 必须设 working-directory：`npm --prefix frontend exec` 不会把 cwd 切到
        # frontend，tsc 会在仓库根找 tsconfig.json → TS5083。（2026-10-28 实测踩到）
        run: npx tsc -b
        working-directory: frontend
      - name: Lint (oxlint)
        run: npm run lint
        working-directory: frontend
      - name: Build (vite build)
        # 单测跑在 jsdom 里，跑不出「生产构建坏了」这类问题（坏 import / 环境变量注入 / 产物拆分）。
        run: npm run build
        working-directory: frontend

  # 评测平台自测：它自己也是代码（判定器 bug 会让「产品失败」的结论错 4 条，见 plan
  # 2026-11-17-eval-platform），所以进 L1 门禁。依赖很轻（fastapi + httpx），几秒钟。
  eval-platform-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install minimal deps
        # 注意连 pytest 一起装：只装 fastapi/httpx 时 `python -m pytest` 直接
        # "No module named pytest"（2026-11-18 第一次跑就踩到）
        run: pip install -q pytest pytest-asyncio fastapi httpx pyyaml
      # 平台的用例归一要读 ragent-py 的测试集（另一个公开仓库）。只需要 JSON，不用装它的依赖。
      - name: Checkout ragent-py testset
        run: git clone --depth 1 https://github.com/acsRef/Rag.git /tmp/ragent-py
      - name: Eval platform tests
        env:
          RAG_REPO: /tmp/ragent-py
        run: |
          python -c "from eval_platform import registry; print('missing:', registry.missing_inputs())"
          python -m pytest eval_platform/tests -q --tb=short

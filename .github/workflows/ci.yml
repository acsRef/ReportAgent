# CI（PR/push 门禁）：**只跑后端**
#
# 2026-10-28 调整（plan: ci-backend-only）：
#   - backend-gate 保留：全量 pytest（persistence 用 PG service 真跑；e2e marker
#     无 REPORTAGENT_E2E 自动 skip）。
#   - frontend-gate（vitest/build）与 contract-e2e（Playwright）**移出本 workflow**，
#     改到 `.github/workflows/e2e-contract.yml`（手动 workflow_dispatch + 夜间 cron），
#     不再阻塞 push / PR。
#
# 原因：Contract E2E 依赖 mock LLM 的固定 fixture + 调用序（语义 kind + seq）。
# 任何 prompt 改动都可能让 fixture 与调用错位，spec 06 因此出现「等不到 商品1」
# 的超时失败——这类失败与业务正确性无关，却会拦住每一次提交。
name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.7.0-pg15
        env:
          POSTGRES_USER: ragent
          POSTGRES_PASSWORD: ragent
          POSTGRES_DB: ragent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ragent:ragent@localhost:5432/ragent
      ANALYSIS_DSN: postgresql://ragent_readonly:ragent_readonly@localhost:5432/ragent
      APP_ENV: development
      ALLOW_INSECURE_DEFAULT_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Init PostgreSQL (app schema + retail seed + read-only role)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=ragent
          psql -h localhost -U ragent -d ragent -f backend/scripts/init_pg.sql
          psql -h localhost -U ragent -d ragent -f backend/scripts/seed_business_p15prelude.sql
          psql -h localhost -U ragent -d ragent -f backend/scripts/setup_app_role.sql
      - name: Backend offline suite (incl. persistence on real PG)
        # 失败详情经 ::error:: 进 job annotations（check-runs API 匿名可读，诊断用）
        run: |
          set +e
          python -m pytest -q --tb=short > /tmp/pytest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -50 /tmp/pytest.log | while IFS= read -r line; do
              echo "::error file=backend-suite::$line"
            done
          fi
          exit $code

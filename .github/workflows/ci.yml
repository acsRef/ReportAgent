# Final Hardening ⑬：最小 CI（PR gate）
#
# 兑现 CLAUDE.md §9「Contract E2E per-PR 入 CI」的无文件声明（此前仓库没有
# .github/workflows）。分层：
#   backend-gate    —— 全量 pytest（persistence 用 PG service 真跑；e2e marker
#                       无 REPORTAGENT_E2E 自动 skip）
#   frontend-gate   —— vitest + tsc/vite build
#   contract-e2e    —— Playwright Contract 层（mock LLM + real PG，spec 内
#                       起 backend :8100，global-setup 起 vite :3000）
# Full E2E（真实 LLM + ragent-py MCP）仍 env-gated（REPORTAGENT_E2E=1）夜间/手动。
name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.7.0-pg15
        env:
          POSTGRES_USER: ragent
          POSTGRES_PASSWORD: ragent
          POSTGRES_DB: ragent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ragent:ragent@localhost:5432/ragent
      ANALYSIS_DSN: postgresql://ragent_readonly:ragent_readonly@localhost:5432/ragent
      APP_ENV: development
      ALLOW_INSECURE_DEFAULT_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Init PostgreSQL (app schema + retail seed + read-only role)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=ragent
          psql -h localhost -U ragent -d ragent -f backend/scripts/init_pg.sql
          psql -h localhost -U ragent -d ragent -f backend/scripts/seed_business_p15prelude.sql
          psql -h localhost -U ragent -d ragent -f backend/scripts/setup_app_role.sql
      - name: Backend offline suite (incl. persistence on real PG)
        run: |
          cd backend
          python -m pytest -q
  frontend-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Frontend unit tests
        run: npm --prefix frontend run test:run
      - name: Frontend type-check + build
        run: npm --prefix frontend run build
  contract-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.7.0-pg15
        env:
          POSTGRES_USER: ragent
          POSTGRES_PASSWORD: ragent
          POSTGRES_DB: ragent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ragent:ragent@localhost:5432/ragent
      ANALYSIS_DSN: postgresql://ragent_readonly:ragent_readonly@localhost:5432/ragent
      APP_ENV: development
      ALLOW_INSECURE_DEFAULT_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
          npm --prefix frontend ci
      - name: Init PostgreSQL
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=ragent
          psql -h localhost -U ragent -d ragent -f backend/scripts/init_pg.sql
          psql -h localhost -U ragent -d ragent -f backend/scripts/seed_business_p15prelude.sql
          psql -h localhost -U ragent -d ragent -f backend/scripts/setup_app_role.sql
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Contract E2E (mock LLM + real PG)
        run: npm run e2e:contract
        working-directory: frontend
        env:
          LLM_PROVIDER: mock

    .right-rail{display:flex;flex-direction:column;background:rgba(255,254,251,.97);border-left:1px solid var(--line-2)}.right-head{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}.right-title{font:700 13px var(--serif)}.agent-ready{color:var(--teal);font-size:8px;font-weight:850;letter-spacing:.1em}.right-scroll{flex:1;overflow-y:auto;padding:15px}.side-section{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}.side-section:last-child{border:0}.side-heading{margin-bottom:10px;color:var(--muted);font-size:8px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.phase-card{padding:12px;border:1px solid var(--line);background:#f7f9f6}.phase-name{font:700 13px var(--serif)}.phase-copy{margin-top:6px;color:var(--muted);font-size:9px;line-height:1.55}.completeness{margin-top:11px}.complete-row{display:flex;justify-content:space-between;color:var(--muted);font-size:8px}.complete-track{height:4px;margin-top:5px;background:#e2e7e3}.complete-fill{height:100%;background:var(--teal);transition:width .3s}.side-list{display:grid;gap:7px}.side-item{display:grid;grid-template-columns:18px 1fr auto;gap:7px;align-items:center;font-size:9px}.side-no{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-deep);font:750 7px var(--mono)}.side-kind{color:var(--faint);font-size:7px}.scope-tags{display:flex;flex-wrap:wrap;gap:5px}.scope-tag{padding:5px 7px;border-radius:4px;background:#edf1ed;font-size:8px}.suggestions{display:grid;gap:6px}.suggestion{display:flex;justify-content:space-between;gap:7px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;text-align:left;cursor:pointer;font-size:9px}.suggestion:hover{border-color:var(--teal);color:var(--teal-deep)}.runtime-toggle{width:100%;display:flex;justify-content:space-between;padding:0;border:0;background:transparent;cursor:pointer}.runtime{display:none;margin-top:11px}.runtime.open{display:grid}.runtime-step{position:relative;display:grid;grid-template-columns:16px 1fr auto;gap:7px;min-height:39px;font-size:8px}.runtime-step::after{content:"";position:absolute;left:5px;top:14px;bottom:0;width:1px;background:#ccd8d3}.runtime-step:last-child::after{display:none}.runtime-dot{width:11px;height:11px;border-radius:50%;background:var(--teal);box-shadow:inset 0 0 0 3px var(--teal-soft);z-index:1}.runtime-step.pending .runtime-dot{background:#dce2de;box-shadow:none}.runtime-step.active .runtime-dot{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}.runtime-detail{display:block;margin-top:3px;color:var(--faint)}.runtime-time{color:var(--faint);font-family:var(--mono)}
    .toast{position:fixed;top:70px;left:50%;z-index:100;transform:translate(-50%,-10px);padding:9px 14px;border-radius:8px;background:var(--ink);color:#fff;box-shadow:0 12px 35px rgba(16,36,62,.25);font-size:10px;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .hidden{display:none!important}@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.reveal{animation:reveal .35s ease both}
    @media(max-width:1180px){.workspace{grid-template-columns:230px minmax(540px,1fr) 0}.right-rail{border:0}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}.chart-grid,.insight-grid{grid-template-columns:1fr}.content-inner{width:calc(100% - 32px)}}
    @media(max-width:880px){.topbar{grid-template-columns:200px 1fr auto}.top-nav{gap:12px}.connection span:last-child{display:none}.workspace{grid-template-columns:0 minmax(0,1fr) 0}.left-rail,.right-rail{border:0}.req-grid{grid-template-columns:1fr}.parse-steps,.stage-list{grid-template-columns:repeat(2,1fr)}}

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 17V8m5 9V4m5 13v-6m5 6V7" stroke="white" stroke-width="2.1" stroke-linecap="round"/><path d="M3 20h18" stroke="white" stroke-width="1.5" opacity=".55"/></svg></span><span class="brand-copy"><span class="brand-name">ReportAgent</span><span class="brand-sub">Analysis atelier</span></span></div>
      <nav class="top-nav"><button class="nav-btn active" data-nav="workspace">工作台</button><button class="nav-btn" data-nav="templates">模板中心</button></nav>
      <div class="top-actions"><span class="connection"><i class="live-dot"></i><span>已连接</span></span><span class="user-chip"><i class="avatar">管</i>管理员</span></div>
    </header>

    <main class="workspace" id="workspace">
      <aside class="left-rail">
        <div class="left-head"><button class="new-btn" id="newSession">＋ 新建分析</button></div>
        <div class="session-scroll" id="sessionList"></div>
        <div class="left-footer">对话会自动保存 · 当前 5 个分析任务</div>
      </aside>

      <section class="center">
        <div class="canvas-head"><div><div class="canvas-kicker" id="canvasKicker">Conversation workspace</div><div class="canvas-title" id="canvasTitle">销量分析需求确认</div></div><div class="head-actions"><button class="quiet-btn" id="focusBtn">聚焦内容</button><button class="quiet-btn" id="sideHint">分析状态</button></div></div>
        <div class="scroll" id="mainScroll"><div class="content-inner" id="mainContent"></div></div>
        <form class="composer" id="composer"><input id="promptInput" autocomplete="off" aria-label="输入分析问题" placeholder="输入业务问题，Agent 会先解析需求并请你确认"><button class="send" id="sendBtn" type="submit">发送 ↗</button></form>
      </section>

      <aside class="right-rail"><div class="right-head"><span class="right-title">分析助手</span><span class="agent-ready">AGENT READY</span></div><div class="right-scroll" id="rightContent"></div></aside>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const completeRequirement={summary:'分析 2024 年华东区域的销售表现，判断增长趋势、主要贡献与异常波动。',metrics:['销售额','毛利额','毛利率'],time:'2024 全年',scope:'华东区域 · 全品类 · 全渠道',dimensions:['月份','城市','产品品类'],methods:['月度趋势','区域贡献','品类结构','异常检测'],blocks:['核心结论','关键指标','趋势图','贡献分析','异常解释','数据明细'],missing:[],selections:{time:'2024 全年',scope:'华东区域'},assumption:true};
    const sessions={
      draft:{id:'draft',group:'今天',title:'销量分析需求确认',query:'帮我分析一下销量',phase:'awaiting_missing',status:'confirm',statusText:'等待补充',time:'刚刚',messages:2,requirement:{summary:'分析销售表现，识别变化趋势和异常。',metrics:['销售额'],time:'',scope:'',dimensions:['月份'],methods:['趋势分析','异常检测'],blocks:['核心结论','关键指标','趋势图','异常解释','数据明细'],missing:['time','scope'],selections:{time:'',scope:''},assumption:false},versions:[],selectedVersion:null},
      sales:{id:'sales',group:'今天',title:'华东销售趋势与异常',query:'分析 2024 年华东销售趋势和异常',phase:'report_ready',status:'done',statusText:'已完成',time:'32 分钟前',messages:7,requirement:{...completeRequirement,selections:{...completeRequirement.selections}},versions:[{v:2,title:'华东与华南经营对比',kind:'south',time:'刚刚'},{v:1,title:'华东销售经营分析',kind:'base',time:'32 分钟前'}],selectedVersion:2},
      returns:{id:'returns',group:'今天',title:'各品类退货原因分析',query:'看看各品类退货情况',phase:'awaiting_confirm',status:'confirm',statusText:'等待确认',time:'1 小时前',messages:3,requirement:{...completeRequirement,summary:'分析各品类退货情况，识别主要退货原因和异常商品。',metrics:['退货金额','退货数量','退货率'],scope:'全国 · 全品类',dimensions:['月份','产品品类','退货原因'],methods:['品类对比','原因结构','异常检测'],selections:{time:'2024 全年',scope:'全国'}},versions:[],selectedVersion:null},
      inventory:{id:'inventory',group:'过去 7 天',title:'区域库存健康度',query:'分析各区域库存健康度',phase:'report_ready',status:'done',statusText:'已完成',time:'昨天',messages:5,requirement:{...completeRequirement,summary:'评估各区域仓库库存健康度与缺货风险。'},versions:[{v:1,title:'区域库存健康度诊断',kind:'base',time:'昨天'}],selectedVersion:1},
      margin:{id:'margin',group:'过去 7 天',title:'产品毛利结构',query:'分析产品毛利结构',phase:'error',status:'error',statusText:'生成失败',time:'3 天前',messages:4,requirement:{...completeRequirement,summary:'识别高毛利贡献商品与低效商品。'},versions:[],selectedVersion:null}
    };
    const state={active:'draft',focus:false,runtimeOpen:false,tableExpanded:false,generationStage:0,timers:[],toastTimer:null};
    const current=()=>sessions[state.active];
    const phaseInfo={idle:['开始新分析','输入业务问题后，Agent 会先拆解需求，不会直接查询数据。',0],parsing:['正在解析需求','正在理解目标、范围和建议分析方式。',28],awaiting_missing:['等待补充信息','后端判断当前需求还有关键信息未确定。',55],awaiting_confirm:['等待最终确认','需求已完整，确认后才会查询数据并生成报告。',100],generating:['正在生成报告','需求已锁定，Agent 正在准备数据和组织报告。',100],adjusting:['正在调整报告','保留当前版本，并生成一个新的报告版本。',100],report_ready:['报告已完成','你可以继续对话调整，新的结果会保存为下一版本。',100],error:['任务未完成','错误保留在当前会话，可直接重试。',100]};
    function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
    function clearTimers(){state.timers.forEach(clearTimeout);state.timers=[]}
    function statusClass(s){return s==='confirm'?'confirm':s==='running'?'running':s==='done'?'done':s==='error'?'error':''}
    function renderSessions(){const groups=['今天','过去 7 天','更早'];$('#sessionList').innerHTML=groups.map(group=>{const rows=Object.values(sessions).filter(s=>s.group===group);if(!rows.length)return'';return`<div class="group-label">${group}</div>${rows.map(s=>`<div class="session ${s.id===state.active?'active':''}"><button class="session-main" data-session="${s.id}"><span class="session-icon">${s.title.slice(0,1)}</span><span><span class="session-title">${escapeHtml(s.title)}</span><span class="status-pill ${statusClass(s.status)}">${s.statusText}</span>${s.id===state.active?`<span class="session-sub">${s.messages} 条消息${s.versions.length?` · ${s.versions.length} 个报告版本`:''}</span>`:''}</span><span class="session-time">${s.time}</span></button>${s.id===state.active&&s.versions.length?`<div class="version-box"><div class="version-caption"><span>报告版本</span><span>仅回看，不重新生成</span></div>${s.versions.slice(0,3).map(v=>`<button class="version-btn ${s.selectedVersion===v.v?'current':''}" data-version="${v.v}"><i class="version-dot"></i><span>v${v.v} · ${escapeHtml(v.title)}</span><span class="version-meta">${s.selectedVersion===v.v?'当前':v.time}</span></button>`).join('')}${s.versions.length>3?'<button class="version-more">查看全部版本 →</button>':''}</div>`:''}</div>`).join('')}`}).join('');$$('[data-session]').forEach(b=>b.onclick=()=>switchSession(b.dataset.session));$$('[data-version]').forEach(b=>b.onclick=e=>{e.stopPropagation();selectVersion(Number(b.dataset.version))})}
    function switchSession(id){clearTimers();state.active=id;state.generationStage=0;render();$('#mainScroll').scrollTop=0;toast(`已恢复「${sessions[id].title}」`)}
    function selectVersion(v){const s=current();s.selectedVersion=v;renderSessions();renderMain();toast(`已切换到报告 v${v}，未调用 Agent`) }
    function userMessage(text){return`<div class="message user reveal"><div class="bubble">${escapeHtml(text)}<div class="bubble-meta">你 · 刚刚</div></div><div class="msg-avatar">你</div></div>`}
    function agentMessage(text){return`<div class="message reveal"><div class="msg-avatar agent">AI</div><div class="bubble">${text}<div class="bubble-meta">ReportAgent · 需求分析</div></div></div>`}
    function parsingHtml(){return`${userMessage(current().query)}${agentMessage('我会先拆解你的问题，确认分析目标和范围。<strong>在你确认前，我不会查询数据或生成报告。</strong>')}<div class="parsing-card reveal"><div class="parsing-top"><span class="parsing-title">正在理解分析需求</span><span class="thinking"><i></i><i></i><i></i></span></div><div class="parsing-copy">LLM 正在结合可分析字段和分析能力，形成一份可确认的需求草稿。</div><div class="parse-steps"><span class="parse-step active">理解业务目标</span><span class="parse-step">匹配指标与维度</span><span class="parse-step">推荐分析方法</span></div></div>`}
    function chips(items,cls=''){return`<div class="chips">${items.map(x=>`<span class="chip ${cls}">${escapeHtml(x)}</span>`).join('')}</div>`}
    function requirementHtml(locked=false){const s=current(),r=s.requirement,missing=s.phase==='awaiting_missing';const ready=r.selections.time&&r.selections.scope&&r.assumption;return`<div class="requirement-card ${missing?'missing':'complete'} ${locked?'locked':''} reveal"><div class="req-head"><div><div class="req-kicker">AGENT REQUIREMENT BRIEF</div><div class="req-title">需求解析与执行确认</div></div><span class="req-status">${locked?'✓ 已确认':missing?`需要补充 ${r.missing.length} 项`:'信息完整 · 待确认'}</span></div><div class="req-summary">${escapeHtml(r.summary)}</div><div class="req-body"><div class="req-grid"><div><div class="req-label">核心指标</div>${chips(r.metrics)}</div><div><div class="req-label">时间与范围</div>${chips([r.selections.time||'时间待补充',r.selections.scope||'范围待补充'])}</div><div><div class="req-label">分析维度</div>${chips(r.dimensions)}</div><div><div class="req-label">建议分析方法</div>${chips(r.methods,'method')}</div><div style="grid-column:1/-1"><div class="req-label">预计报告内容</div>${chips(r.blocks,'block')}</div></div>${missing&&!locked?missingOptions(r):''}</div>${locked?'':`<div class="req-actions"><span class="req-hint">确认后 Agent 才会查询数据并生成报告</span><span class="action-group">${missing?`<button class="secondary" data-action="continue-chat">继续对话补充</button><button class="primary" data-action="review-requirement" ${ready?'':'disabled'}>补充完成，查看确认</button>`:`<button class="secondary" data-action="edit-requirement">修改需求</button><button class="primary" data-action="confirm-generate">确认并生成报告</button>`}</span></div>`}</div>`}
    function missingOptions(r){return`<div class="missing-zone"><div class="missing-heading"><span class="missing-title">需要你确认的信息</span><span class="missing-note">选项由后端根据当前问题返回</span></div><div class="option-group"><div class="option-label">时间范围</div><div class="option-row">${['本月','上月','今年','2024 全年'].map(x=>`<button class="option ${r.selections.time===x?'selected':''}" data-field="time" data-value="${x}">${x}</button>`).join('')}</div></div><div class="option-group"><div class="option-label">分析范围</div><div class="option-row">${['华东区域','华南区域','全国','全部区域'].map(x=>`<button class="option ${r.selections.scope===x?'selected':''}" data-field="scope" data-value="${x}">${x}</button>`).join('')}</div></div><div class="assumption"><span>Agent 暂时假设：按月环比，并对异常月份做原因解释</span><span class="assumption-actions"><button class="mini-btn ${r.assumption?'accepted':''}" data-action="accept-assumption">${r.assumption?'✓ 已接受':'接受'}</button><button class="mini-btn" data-action="modify-assumption">修改</button></span></div></div>`}
    function progressHtml(adjusting=false){const labels=adjusting?['保留当前版本','理解调整要求','更新分析结果','生成新版本']:['需求已确认','准备分析数据','执行分析查询','组织分析报告'];const idx=state.generationStage;return`${requirementHtml(true)}${adjusting?agentMessage(`收到调整要求：<strong>${escapeHtml(current().pendingAdjustment||'')}</strong>。我会保留当前报告，并生成新版本。`):agentMessage('需求已确认。现在开始查询数据并生成报告，你可以在右侧查看阶段进度。')}<div class="progress-card reveal"><div class="progress-top"><span class="progress-title">${adjusting?'正在生成新报告版本':'Agent 正在执行分析'}</span><span style="color:var(--amber);font-size:9px">${Math.min(99,18+idx*25)}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${18+idx*25}%"></div></div><div class="stage-list">${labels.map((x,i)=>`<span class="stage ${i<idx?'done':i===idx?'active':''}">${i<idx?'✓ ':i===idx?'◌ ':'○ '}${x}</span>`).join('')}</div><div class="progress-detail">${labels[idx]||'即将完成'} · ${adjusting?'原报告仍可回看':'确认后才开始正式查询'}</div><div class="progress-actions"><button class="danger-btn" data-action="cancel-generation">停止生成</button></div></div>${adjusting&&current().versions.length?reportHtml(true):''}`}
    function reportHtml(dimmed=false){const s=current(),v=s.versions.find(x=>x.v===s.selectedVersion)||s.versions[0]||{v:1,title:'华东销售经营分析',kind:'base'};const compare=v.kind==='south';return`<div class="report-shell reveal" style="${dimmed?'opacity:.58;pointer-events:none':''}"><div class="report-toolbar"><span class="report-version">报告 v${v.v} · ${escapeHtml(v.title)}</span><span class="report-tools"><button class="quiet-btn" data-action="favorite">☆ 收藏</button><button class="quiet-btn" data-action="export">导出</button><button class="quiet-btn" data-action="regenerate">重新生成</button><button class="quiet-btn" data-action="continue-adjust">继续调整</button></span></div><article class="report-paper"><header class="report-header"><div class="report-number">REPORT / v${v.v}</div><h1 class="report-title">${compare?'华东与华南销售经营对比':'华东区域销售经营分析'}</h1><div class="report-meta"><span><i class="meta-key">数据范围</i>2024.01—2024.12</span><span><i class="meta-key">分析范围</i>${compare?'华东 vs 华南':'华东 · 全品类 · 全渠道'}</span><span><i class="meta-key">报告来源</i>当前会话第 ${v.v} 个版本</span><span><i class="meta-key">可信度</i>高</span></div></header><section class="finding"><div class="finding-label">核心发现</div><div class="finding-text">${compare?'华东全年增速领先华南 <strong>6.8 个百分点</strong>，优势主要来自 Q4 电子产品；华南走势更平稳。':'华东全年销售额保持增长，但 <strong>8 月出现阶段性回落</strong>；电子产品贡献 44%，增长主要由上海与杭州驱动。'}</div></section>${reportBody(compare)}</article></div>`}

    function renderMain(){const s=current();$('#canvasTitle').textContent=s.title;$('#canvasKicker').textContent=s.phase==='report_ready'?'Report conversation':s.phase==='idle'?'New analysis':'Requirement conversation';let html='';if(s.phase==='idle')html=emptyHtml();else if(s.phase==='parsing')html=parsingHtml();else if(s.phase==='awaiting_missing')html=`${userMessage(s.query)}${agentMessage('我已经完成初步拆解，但还缺少关键信息。请确认下面的需求草稿；<strong>这些缺失项由后端分析结果返回</strong>。')}${requirementHtml()}`;else if(s.phase==='awaiting_confirm')html=`${userMessage(s.query)}${agentMessage('需求已经完整。我建议按下面的方法组织分析，请确认后再开始查询和生成报告。')}${requirementHtml()}`;else if(s.phase==='generating')html=`${userMessage(s.query)}${progressHtml(false)}`;else if(s.phase==='adjusting')html=`${userMessage(s.query)}${progressHtml(true)}`;else if(s.phase==='report_ready')html=`${userMessage(s.query)}${agentMessage('报告已生成。你可以继续对话要求增加对比、调整维度或深入解释；每次调整都会保留为新的报告版本。')}${requirementHtml(true)}${reportHtml(false)}`;else html=errorHtml();$('#mainContent').innerHTML=html;bindMainActions();updateComposer()}
    function renderRight(){const s=current(),info=phaseInfo[s.phase]||phaseInfo.idle;const r=s.requirement||completeRequirement;let stageSection='';if(['generating','adjusting'].includes(s.phase)){const names=s.phase==='adjusting'?['保留版本','理解调整','更新结果','生成新版本']:['锁定需求','准备数据','执行查询','生成报告'];stageSection=`<section class="side-section"><div class="side-heading">任务进度</div><div class="side-list">${names.map((x,i)=>`<div class="side-item"><span class="side-no">${i<state.generationStage?'✓':i+1}</span><span>${x}</span><span class="side-kind">${i<state.generationStage?'完成':i===state.generationStage?'进行中':'等待'}</span></div>`).join('')}</div></section>`}else if(s.phase==='report_ready'){stageSection=`<section class="side-section"><div class="side-heading">当前报告结构</div><div class="side-list">${[['01','经营规模与效率','KPI'],['02','增长节奏与贡献','趋势'],['03','异常与原因解释','洞察'],['04','关键数据证据','明细']].map(x=>`<div class="side-item"><span class="side-no">${x[0]}</span><span>${x[1]}</span><span class="side-kind">${x[2]}</span></div>`).join('')}</div></section><section class="side-section"><div class="side-heading">推荐继续分析</div><div class="suggestions"><button class="suggestion" data-suggest="增加华南区域对比"><span>增加华南区域对比</span><span>↗</span></button><button class="suggestion" data-suggest="异常月份再解释详细一点"><span>深入解释异常月份</span><span>↗</span></button></div></section>`}else if(s.phase==='awaiting_missing'){stageSection=`<section class="side-section"><div class="side-heading">待补充信息</div><div class="side-list"><div class="side-item"><span class="side-no">!</span><span>时间范围</span><span class="side-kind">缺失</span></div><div class="side-item"><span class="side-no">!</span><span>分析范围</span><span class="side-kind">缺失</span></div><div class="side-item"><span class="side-no">?</span><span>Agent 分析假设</span><span class="side-kind">待接受</span></div></div></section>`}else if(s.phase==='awaiting_confirm'){stageSection=`<section class="side-section"><div class="side-heading">确认后预计生成</div><div class="scope-tags">${r.blocks.map     function runtimeHtml(phase){const active=phase==='parsing'?0:['generating','adjusting'].includes(phase)?Math.min(3,state.generationStage):phase==='report_ready'?4:-1;const rows=[['需求解析','拆解目标、范围和方法'],['数据准备','定位可分析字段'],['查询生成','生成并校验分析查询'],['报告组织','选择报告模块']];return rows.map((x,i)=>`<div class="runtime-step ${i<active?'':i===active?'active':'pending'}"><i class="runtime-dot"></i><span>${x[0]}<small class="runtime-detail">${x[1]}</small></span><span class="runtime-time">${i<active?'完成':i===active?'运行中':'等待'}</span></div>`).join('')}
    function updateComposer(){const s=current(),input=$('#promptInput'),btn=$('#sendBtn');const busy=['parsing','generating','adjusting'].includes(s.phase);input.disabled=busy;btn.disabled=busy;if(s.phase==='idle')input.placeholder='输入业务问题，Agent 会先解析需求并请你确认';else if(s.phase==='awaiting_missing')input.placeholder='也可以直接对话补充，例如：看 2024 全年华东区域';else if(s.phase==='awaiting_confirm')input.placeholder='继续补充或修改需求，确认后再生成';else if(s.phase==='report_ready')input.placeholder='继续调整这份报告，例如：增加华南区域对比';else if(s.phase==='error')input.placeholder='修改需求或点击重试';else input.placeholder='Agent 正在处理中…'}

    function submitQuestion(text){const s=current();s.query=text;s.title=text.length>16?text.slice(0,16)+'…':text;s.phase='parsing';s.status='running';s.statusText='正在解析';s.time='刚刚';s.messages=1;s.versions=[];s.selectedVersion=null;s.requirement={...completeRequirement,selections:{...completeRequirement.selections}};render();const t=setTimeout(()=>{const clear=text.includes('2024')&&text.includes('华东');if(clear){s.phase='awaiting_confirm';s.requirement={...completeRequirement,selections:{...completeRequirement.selections}};s.statusText='等待确认'}else{s.phase='awaiting_missing';s.requirement={summary:'分析销售表现，识别变化趋势和异常。',metrics:['销售额'],time:'',scope:'',dimensions:['月份'],methods:['趋势分析','异常检测'],blocks:['核心结论','关键指标','趋势图','异常解释','数据明细'],missing:['time','scope'],selections:{time:'',scope:''},assumption:false};s.statusText='等待补充'}s.status='confirm';s.messages=2;render();toast(clear?'需求解析完成，请确认后生成':'需求解析完成，还需要补充 2 项')},850);state.timers.push(t)}
    function startGeneration(adjusting){const s=current();clearTimers();s.phase=adjusting?'adjusting':'generating';s.status='running';s.statusText=adjusting?'正在生成新版本':'生成中';state.generationStage=0;render();[1,2,3,4].forEach((stage,i)=>{const t=setTimeout(()=>{state.generationStage=stage;if(stage<4){renderMain();renderRight();renderSessions()}else finishGeneration(adjusting)},650*(i+1));state.timers.push(t)})}
    function finishGeneration(adjusting){const s=current(),next=adjusting?(Math.max(0,...s.versions.map(v=>v.v))+1):1;const kind=adjusting&&/华南|区域对比/.test(s.pendingAdjustment||'')?'south':'base';const title=kind==='south'?'华东与华南经营对比':adjusting?'调整后的销售经营分析':'华东销售经营分析';s.versions.unshift({v:next,title,kind,time:'刚刚'});s.selectedVersion=next;s.phase='report_ready';s.status='done';s.statusText='已完成';s.messages+=2;s.pendingAdjustment='';state.generationStage=0;render();setTimeout(()=>{$('#mainScroll').scrollTo({top:$('#mainContent').scrollHeight,behavior:'smooth'})},50);toast(`报告 v${next} 已生成并保留在当前会话`)}
    function startAdjustment(text){const s=current();if(s.phase!=='report_ready')return;s.pendingAdjustment=text;s.phase='adjusting';s.status='running';s.statusText='生成新版本';s.messages+=1;startGeneration(true)}
    function newSession(){clearTimers();const id='new'+Date.now();sessions[id]={id,group:'今天',title:'新的分析',query:'',phase:'idle',status:'',statusText:'未开始',time:'刚刚',messages:0,requirement:{...completeRequirement,selections:{...completeRequirement.selections}},versions:[],selectedVersion:null};state.active=id;render();setTimeout(()=>$('#promptInput').focus(),20)}
    function render(){renderSessions();renderMain();renderRight()}
    $('#composer').onsubmit=e=>{e.preventDefault();const input=$('#promptInput'),text=input.value.trim();if(!text)return;input.value='';const s=current();if(s.phase==='idle')submitQuestion(text);else if(s.phase==='awaiting_missing'){if(/2024|今年/.test(text))s.requirement.selections.time=text.includes('2024')?'2024 全年':'今年';if(/华东|华南|全国/.test(text))s.requirement.selections.scope=text.match(/华东|华南|全国/)[0]+(text.includes('全国')?'':'区域');s.requirement.assumption=true;if(s.requirement.selections.time&&s.requirement.selections.scope){s.requirement.missing=[];s.phase='awaiting_confirm';s.statusText='等待确认'}render()}else if(s.phase==='awaiting_confirm'){s.requirement.summary=text;s.requirement.assumption=true;render();toast('已更新需求草稿，仍需确认后生成')}else if(s.phase==='report_ready')startAdjustment(text)};
    $('#newSession').onclick=newSession;$('#focusBtn').onclick=()=>{state.focus=!state.focus;$('#workspace').classList.toggle('focus',state.focus);$('#focusBtn').textContent=state.focus?'退出聚焦':'聚焦内容';toast(state.focus?'已进入聚焦模式 · 按 Esc 退出':'已返回工作台')};$('#sideHint').onclick=()=>toast(phaseInfo[current().phase][1]);$$('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='templates')toast('模板中心保存的是已确认需求配置 · 原型暂不跳转');else toast('当前已在工作台')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.focus){state.focus=false;$('#workspace').classList.remove('focus');$('#focusBtn').textContent='聚焦内容'}});
    render();
  </script>
</body>
</html>

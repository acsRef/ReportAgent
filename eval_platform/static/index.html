<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 评测平台 · ReportAgent × ragent-py</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>AI 评测平台</h1>
        <p>ReportAgent（Agent Runtime） × ragent-py（RAG Runtime） · 实时测试 + 资产沉淀 + 证据分量</p>
      </div>
    </div>
    <div class="health" id="health"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="active">总览</button>
    <button data-tab="live">实时测试</button>
    <button data-tab="assets">资产</button>
    <button data-tab="scenario">场景测试</button>
    <button data-tab="risk">风险库</button>
    <button data-tab="history">历史</button>
    <button data-tab="method">方法</button>
  </nav>

  <main>
    <section id="tab-overview" class="tab active"></section>
    <section id="tab-live" class="tab">
      <div class="split">
        <aside class="picker">
          <div class="picker-head">
            <select id="case-project">
              <option value="">全部项目</option>
              <option value="reportagent">ReportAgent</option>
              <option value="ragent">ragent-py</option>
            </select>
            <input id="case-search" placeholder="搜 id / 标题 / 类别" />
          </div>
          <ul id="case-list" class="case-list"></ul>
        </aside>
        <div class="detail" id="case-detail">
          <p class="muted">左侧选一条用例 → 看期望 → 点「运行」。</p>
        </div>
      </div>
    </section>
    <section id="tab-scenario" class="tab"></section>
    <section id="tab-assets" class="tab"></section>
    <section id="tab-risk" class="tab"></section>
    <section id="tab-history" class="tab"></section>
    <section id="tab-method" class="tab">
      <div class="split">
        <aside class="picker"><ul id="doc-list" class="case-list"></ul></aside>
        <div class="doc-body" id="doc-body"><p class="muted">选择左侧文档。</p></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>判定分三层：deterministic / gold 进 pass 率，advisory 与 deferred 不计分并在页面标注。</span>
    <span id="foot-version"></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
